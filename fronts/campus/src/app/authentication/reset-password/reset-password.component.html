<div
    class="auth-wrapper auth-v2"
    [class.dark-theme]="themeService.isDark()"
>
  <div class="auth-inner row m-0">
    <!-- Left Text-->
    <div class="d-none d-lg-flex col-lg-8 align-items-center p-5">
      <div class="w-100 d-lg-flex align-items-center justify-content-center px-5">
        <img class="img-fluid" [src]="themeService.isDark() ? 'assets/images/pages/forgot-password-v2-dark.svg'
                : 'assets/images/pages/forgot-password-v2.svg'
                " alt="Password reset" />
      </div>
    </div>
    <!-- /Left Text-->
    <div class="d-flex col-lg-4 align-items-center auth-bg px-2 p-lg-5">
      <div class="col-12 col-sm-8 col-md-6 col-lg-12 px-xl-2 mx-auto auth-form">
      <div class="form-content">
        <div class="logo">
          <img src="assets/images/logo/logotipo.svg" alt="logo">
          <img src="assets/images/logo/logotipo.svg" class="d-none" alt="logo">
        </div>
        <div class="title">
          <h1 class="fw-semibold">
            {{ 'resetPassword.title' | transloco }}
          </h1>
          <p class="fw-medium">
            {{ 'resetPassword.instructions' | transloco }}
          </p>
        </div>
        <form [formGroup]="resetPasswordForm" (ngSubmit)="onSubmit()">
          <div class="form-group position-relative">
            <label class="main-label d-block fw-medium text-black">
              {{ 'resetPassword.currentPassword' | transloco }}
            </label>
            <input [type]="isPassword1Visible ? 'text' : 'password'"
                   formControlName="old_password"
                   class="form-control"
                   [placeholder]="'resetPassword.currentPasswordPlaceholder' | transloco">
            <button type="button" (click)="togglePassword1Visibility()"
                    class="icon-button p-0 border-0 bg-transparent transition">
              <i [ngClass]="isPassword1Visible ? 'ri-eye-line' : 'ri-eye-off-line'"></i>
            </button>
          </div>
          <div class="form-group position-relative">
            <label [innerHTML]="'resetPassword.newPassword' | transloco"></label>
            <input [type]="isPassword2Visible ? 'text' : 'password'"
               formControlName="password"
               class="form-control"
              [placeholder]="'resetPassword.newPasswordPlaceholder' | transloco">
            <button type="button" (click)="togglePassword2Visibility()"
                    class="icon-button p-0 border-0 bg-transparent transition">
              <i [ngClass]="isPassword2Visible ? 'ri-eye-line' : 'ri-eye-off-line'"></i>
            </button>
            <div *ngIf="f.password.invalid && f.password.touched" class="text-danger small">
              <span *ngIf="f.password.errors?.['required']">{{ 'validation.required' | transloco }}</span>
              <span *ngIf="f.password.errors?.['minlength']">{{ 'validation.minLength' | transloco: { min: 6 } }}</span>
            </div>
          </div>
          <div class="form-group position-relative">
            <label [innerHTML]="'resetPassword.confirmPassword' | transloco"></label>
            <input [type]="isPassword3Visible ? 'text' : 'password'"
                    formControlName="password_confirmation"
                   class="form-control"
            [placeholder]="'resetPassword.confirmPasswordPlaceholder' | transloco">
            <button type="button" (click)="togglePassword3Visibility()"
                    class="icon-button p-0 border-0 bg-transparent transition">
              <i [ngClass]="isPassword3Visible ? 'ri-eye-line' : 'ri-eye-off-line'"></i>
            </button>
          </div>
          <button type="submit"
                  [disabled]="resetPasswordForm.invalid"
                  class="btn-box d-block w-100 border-0 transition fw-medium border-radius">
            <span class="d-flex align-items-center justify-content-center">
                <i class="material-symbols-outlined">
                    autorenew
                </i>
                {{ 'resetPassword.submitButton' | transloco }}
            </span>
          </button>
          <p class="info">
           <a routerLink="/auth" class="fw-semibold text-primary">
             {{ 'resetPassword.backToSignIn' | transloco }}
           </a>
          </p>
        </form>
      </div>
    </div>
    </div>
  </div>
</div>
