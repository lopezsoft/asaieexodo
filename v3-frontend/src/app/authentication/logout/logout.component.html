<section class="auth-card text-center">
  <div class="auth-status-icon">
    <span class="material-symbols-outlined">logout</span>
  </div>

  <div class="auth-card-header">
    <h1>{{ 'logout.title' | transloco }}</h1>
    <p>{{ 'logout.subtitle' | transloco }}</p>
  </div>

  <a routerLink="/auth" class="auth-submit-btn text-decoration-none">
    <span class="material-symbols-outlined">login</span>
    <span>{{ 'logout.cta' | transloco }}</span>
  </a>
</section>
