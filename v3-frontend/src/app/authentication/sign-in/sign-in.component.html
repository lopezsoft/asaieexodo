<div
    class="auth-wrapper auth-v2"
    [class.dark-theme]="themeService.isDark()"
>
  <div class="auth-inner row m-0">
    <!-- Left Text-->
    <div class="d-none d-lg-flex col-lg-8 align-items-center p-5">
      <div class="w-100 d-lg-flex align-items-center justify-content-center px-5">
        <img class="img-fluid" [src]="themeService.isDark() ? 'assets/images/pages/login-v2-dark.svg'
        : 'assets/images/pages/online.svg'
        " alt="Login V2" />
      </div>
    </div>
    <!-- /Left Text-->
    <!-- Login-->
    <div class="d-flex col-lg-4 align-items-center auth-bg px-2 p-lg-5">
      <div class="col-12 col-sm-8 col-md-6 col-lg-12 px-xl-2 mx-auto">
        <div class="auth-form">
          <div class="form-content">
              <div class="logo">
                  <img src="assets/images/logo/logotipo.svg" alt="logo">
                  <img src="assets/images/logo/logotipo.svg" class="d-none" alt="logo">
              </div>
              <div class="title">
                  <h1 class="fw-semibold">
                    {{ 'signIn.welcome' | transloco }}
                  </h1>
                  <p class="fw-medium">
                    {{ 'signIn.instructions' | transloco }}
                  </p>
              </div>
              <div class="with-socials d-flex align-items-center justify-content-between">
                  <div>
                      <button type="button" class="d-block w-100 border-radius transition">
                          <img src="assets/images/icons/google.svg" alt="google">
                      </button>
                  </div>
                  <div>
                      <button type="button" class="d-block w-100 border-radius transition">
                          <img src="assets/images/icons/facebook2.svg" alt="facebook">
                      </button>
                  </div>
                  <div>
                      <button type="button" class="d-block w-100 border-radius transition">
                          <img src="assets/images/icons/apple.svg" alt="apple">
                      </button>
                  </div>
              </div>
            <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

              <div class="form-group">
                <label class="main-label d-block fw-medium text-black" [innerHTML]="'signIn.emailLabel' | transloco"></label>
                <input
                  type="text"
                  class="form-control"
                  formControlName="email"  [placeholder]="'signIn.emailPlaceholder' | transloco">
              </div>

              <div class="form-group position-relative">
                <label class="main-label d-block fw-medium text-black" [innerHTML]="'signIn.passwordLabel' | transloco"></label>
                <input [type]="isPasswordVisible ? 'text' : 'password'" class="form-control" formControlName="password"
                       [placeholder]="'signIn.passwordPlaceholder' | transloco">
                <button type="button" (click)="togglePasswordVisibility()" class="icon-button p-0 border-0 bg-transparent transition">
                  <i [ngClass]="isPasswordVisible ? 'ri-eye-line' : 'ri-eye-off-line'"></i>
                </button>
              </div>

              <div class="forgot-password">
                <a routerLink="/auth/forgot-password" class="text-primary fw-semibold"
                   [innerHTML]="'signIn.forgotPassword' | transloco"></a>
              </div>

              <button
                  type="submit"
                  class="btn-box d-block w-100 border-0 transition fw-medium border-radius"
                  [disabled]="!loginForm.valid"> <span class="d-flex align-items-center justify-content-center">
                    <i class="material-symbols-outlined">
                        login
                    </i>
                    <span [innerHTML]="'signIn.button' | transloco"></span>
                </span>
              </button>

             <!-- <p class="info">
                <span [innerHTML]="'signIn.noAccount' | transloco"></span>
                <a routerLink="/auth/sign-up" class="fw-semibold text-primary" [innerHTML]="'signIn.signUp' | transloco"></a>
              </p>-->

            </form>
          </div>
        </div>
      </div>
    </div>
    <!-- Right Text-->
  </div>
</div>
