<div class="v3-form-actions w-100 mt-4">
  <button
    type="button"
    class="btn btn-v3-ghost"
    (click)="cancelEvent.emit()"
    [disabled]="loading"
  >
    <i class="material-symbols-outlined fs-6" aria-hidden="true">close</i>
    <span>{{ 'buttons.cancel' | transloco }}</span>
  </button>

  @if (showSaveAndCreate) {
    <button
      type="button"
      class="btn btn-success"
      (click)="saveAndCreateEvent.emit()"
      [disabled]="disabled || loading"
    >
      @if (loading) {
        <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
      } @else {
        <i class="material-symbols-outlined fs-6" aria-hidden="true">library_add</i>
      }
      <span>{{ 'buttons.saveAndCreate' | transloco }}</span>
    </button>
  }

  <button
    type="button"
    class="btn btn-primary"
    (click)="saveAndCloseEvent.emit()"
    [disabled]="disabled || loading"
  >
    @if (loading) {
      <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
    } @else {
      <i class="material-symbols-outlined fs-6" aria-hidden="true">check_circle</i>
    }
    <span>{{ 'buttons.saveAndClose' | transloco }}</span>
  </button>
</div>
