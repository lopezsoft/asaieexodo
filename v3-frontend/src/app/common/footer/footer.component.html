<footer
    [class.card-without-border-radius]="themeService.isCardWithoutBorderRadius()"
    [class.card-with-box-shadow]="themeService.isCardWithBoxShadow()"
    class="footer-area"
    [class.card-borderd]="themeService.isCardBordered()"
>
    <div class="footer-left">
        &copy; 2014 - {{ currentYear }}
        <a href="https://lopezsoft.net.co" target="_blank" rel="noopener noreferrer">
            LOPEZSOFT S.A.S
        </a> &middot; Todos los derechos reservados.
    </div>
    <div class="footer-right">
        <span class="footer-version-pill">
            <span>Hecho con</span>
            <i class="material-symbols-outlined footer-heart" aria-hidden="true">favorite</i>
            <span class="footer-version-sep" aria-hidden="true">&middot;</span>
            <span class="footer-version">Versión {{ appVersion }}</span>
        </span>
    </div>
</footer>
