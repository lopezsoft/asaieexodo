name: asaie-v3-local-infra

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg17
    container_name: asaie-v3-postgres
    restart: unless-stopped
    shm_size: 256mb
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-asaie_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatorio}
      POSTGRES_DB: ${POSTGRES_DB:-asaie_v3_unified}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --data-checksums"
      TZ: America/Bogota
    volumes:
      - postgres_v3_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "maintenance_work_mem=128MB"
      - "-c"
      - "effective_cache_size=512MB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "idle_in_transaction_session_timeout=60000"
      - "-c"
      - "log_min_duration_statement=500"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U $${POSTGRES_USER:-asaie_admin} -d $${POSTGRES_DB:-asaie_v3_unified}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - asaie_v3_net

  redis:
    image: redis:7.4-alpine
    container_name: asaie-v3-redis
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${REDIS_PORT:-6384}:6379"
    environment:
      TZ: America/Bogota
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD es obligatorio}
    # Politica noeviction obligatoria para gestion de colas con BullMQ y autenticacion --requirepass
    command:
      - "sh"
      - "-c"
      - 'exec redis-server --appendonly yes --appendfsync everysec --maxmemory 512mb --maxmemory-policy noeviction --requirepass "$$REDISCLI_AUTH"'
    volumes:
      - redis_v3_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - asaie_v3_net

networks:
  asaie_v3_net:
    name: asaie_v3_net
    driver: bridge

volumes:
  postgres_v3_data:
    name: asaie_v3_postgres_data
  redis_v3_data:
    name: asaie_v3_redis_data
